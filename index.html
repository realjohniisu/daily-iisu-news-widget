<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Daily iiSU News</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.08), transparent 35%),
        radial-gradient(circle at 80% 80%, rgba(255,255,255,0.05), transparent 35%),
        #080808;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}

.calendar-shell {
    width: min(100%, 100vh);
    height: min(100%, 100vw);
    aspect-ratio: 1 / 1;
    max-width: 100%;
    max-height: 100%;
    padding: clamp(10px, 2.5%, 24px);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: clamp(18px, 4%, 36px);
    background: rgba(255,255,255,0.055);
    backdrop-filter: blur(28px);
    -webkit-backdrop-filter: blur(28px);
    box-shadow:
        0 25px 80px rgba(0,0,0,0.55),
        inset 0 1px 0 rgba(255,255,255,0.08);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.calendar-header {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    gap: 8px;
    margin-bottom: clamp(8px, 2%, 20px);
}

.month-title {
    margin: 0;
    text-align: center;
    font-size: clamp(16px, 4%, 30px);
    font-weight: 700;
    letter-spacing: -0.03em;
    white-space: nowrap;
}

.nav-button {
    width: clamp(30px, 7%, 48px);
    height: clamp(30px, 7%, 48px);
    min-width: 30px;
    min-height: 30px;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 50%;
    background: rgba(255,255,255,0.07);
    color: white;
    cursor: pointer;
    font-size: clamp(17px, 4%, 25px);
    display: flex;
    align-items: center;
    justify-content: center;
}

.nav-button:disabled {
    opacity: 0.2;
    cursor: default;
}

.nav-button.prev {
    justify-self: start;
}

.nav-button.next {
    justify-self: end;
}

.weekdays {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: clamp(3px, 1%, 8px);
    margin-bottom: clamp(4px, 1%, 9px);
}

.weekday {
    min-width: 0;
    text-align: center;
    font-size: clamp(8px, 1.8%, 13px);
    font-weight: 700;
    color: rgba(255,255,255,0.42);
    text-transform: uppercase;
}

.days {
    flex: 1 1 auto;
    min-width: 0;
    min-height: 0;
    display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    grid-template-rows: repeat(6, minmax(0, 1fr));
    gap: clamp(3px, 1%, 9px);
}

.day {
    position: relative;
    min-width: 0;
    min-height: 0;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.055);
    border-radius: clamp(8px, 2%, 17px);
    background: rgba(255,255,255,0.025);
    color: rgba(255,255,255,0.28);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(11px, 3%, 22px);
    font-weight: 600;
    transition:
        background 0.18s ease,
        border-color 0.18s ease,
        transform 0.18s ease;
}

.day.empty {
    border-color: transparent;
    background: transparent;
}

.day.future {
    color: rgba(255,255,255,0.16);
}

.day.episode {
    cursor: pointer;
    color: white;
    background: rgba(255,255,255,0.075);
    border-color: rgba(255,255,255,0.13);
}

.day.episode:hover {
    transform: scale(1.045);
    background: rgba(255,255,255,0.14);
    border-color: rgba(255,255,255,0.25);
    z-index: 2;
}

.day.selected {
    background: rgba(255,255,255,0.18);
    border-color: rgba(255,255,255,0.4);
}

.day.controller-selected {
    background: rgba(255,255,255,0.25);
    border-color: rgba(255,255,255,0.85);
    box-shadow:
        0 0 0 2px rgba(255,255,255,0.15),
        0 0 25px rgba(255,255,255,0.16);
    transform: scale(1.045);
    z-index: 3;
}

.day.today {
    background: rgba(255,255,255,0.24);
    border-color: rgba(255,255,255,0.75);
    box-shadow:
        0 0 0 2px rgba(255,255,255,0.12),
        0 0 30px rgba(255,255,255,0.12);
    color: white;
}

.day-number {
    position: relative;
    z-index: 1;
}

.episode-dot {
    position: absolute;
    width: clamp(3px, 0.8%, 7px);
    height: clamp(3px, 0.8%, 7px);
    border-radius: 50%;
    bottom: clamp(4px, 1.5%, 9px);
    background: white;
    opacity: 0.8;
}

.day.today .episode-dot {
    opacity: 1;
    box-shadow: 0 0 8px rgba(255,255,255,0.8);
}

.video-overlay {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 5%;
    background: rgba(0,0,0,0.72);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
}

.video-overlay.open {
    opacity: 1;
    pointer-events: auto;
}

.video-modal {
    position: relative;
    width: min(90%, 900px);
    aspect-ratio: 16 / 9;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: clamp(12px, 2.5%, 24px);
    overflow: hidden;
    background: #000;
    box-shadow: 0 30px 100px rgba(0,0,0,0.75);
}

.video-container,
.video-container iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
}

.close-button {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 2;
    width: 42px;
    height: 42px;
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 50%;
    background: rgba(0,0,0,0.55);
    color: white;
    cursor: pointer;
    font-size: 28px;
    line-height: 1;
}

.loading {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.5);
    font-size: 14px;
}
</style>
</head>

<body>

<div class="calendar-shell">

    <div class="calendar-header">
        <button class="nav-button prev" id="prevButton">‹</button>
        <h1 class="month-title" id="monthTitle"></h1>
        <button class="nav-button next" id="nextButton">›</button>
    </div>

    <div class="weekdays">
        <div class="weekday">Sun</div>
        <div class="weekday">Mon</div>
        <div class="weekday">Tue</div>
        <div class="weekday">Wed</div>
        <div class="weekday">Thu</div>
        <div class="weekday">Fri</div>
        <div class="weekday">Sat</div>
    </div>

    <div class="days" id="calendarDays">
        <div class="loading">Loading...</div>
    </div>

</div>

<div class="video-overlay" id="videoOverlay">

    <div class="video-modal" id="videoModal">

        <button
            class="close-button"
            id="closeButton"
        >×</button>

        <div
            class="video-container"
            id="videoContainer"
        ></div>

    </div>

</div>

<audio id="moveSound" preload="auto">
    <source src="Move.wav" type="audio/wav">
</audio>

<audio id="scrollSound" preload="auto">
    <source src="Scroll.wav" type="audio/wav">
</audio>

<audio id="linkSound" preload="auto">
    <source src="Link.wav" type="audio/wav">
</audio>

<script>
const EPISODES_URL =
    "https://raw.githubusercontent.com/realjohniisu/daily-iisu-news/main/episodes.json";

const FIRST_ALLOWED_MONTH =
    new Date(2026, 8, 1);

const monthTitle =
    document.getElementById("monthTitle");

const calendarDays =
    document.getElementById("calendarDays");

const prevButton =
    document.getElementById("prevButton");

const nextButton =
    document.getElementById("nextButton");

const videoOverlay =
    document.getElementById("videoOverlay");

const videoModal =
    document.getElementById("videoModal");

const videoContainer =
    document.getElementById("videoContainer");

const closeButton =
    document.getElementById("closeButton");

const moveSound =
    document.getElementById("moveSound");

const scrollSound =
    document.getElementById("scrollSound");

const linkSound =
    document.getElementById("linkSound");

let episodes = [];

let episodeByDate =
    new Map();

let currentMonth =
    new Date(
        FIRST_ALLOWED_MONTH.getFullYear(),
        FIRST_ALLOWED_MONTH.getMonth(),
        1
    );

let selectedEpisode =
    null;

let hasPlayedHoverSound =
    false;

function getTodayDate() {
    const now =
        new Date();

    return [
        now.getFullYear(),
        String(
            now.getMonth() + 1
        ).padStart(2, "0"),
        String(
            now.getDate()
        ).padStart(2, "0")
    ].join("-");
}

function formatDate(date) {
    return [
        date.getFullYear(),
        String(
            date.getMonth() + 1
        ).padStart(2, "0"),
        String(
            date.getDate()
        ).padStart(2, "0")
    ].join("-");
}

function parseEpisodeDate(value) {
    if (
        typeof value !== "string" ||
        !/^\d{4}-\d{2}-\d{2}$/.test(value)
    ) {
        return null;
    }

    const parts =
        value.split("-").map(Number);

    const date =
        new Date(
            parts[0],
            parts[1] - 1,
            parts[2]
        );

    if (
        date.getFullYear() !== parts[0] ||
        date.getMonth() !== parts[1] - 1 ||
        date.getDate() !== parts[2]
    ) {
        return null;
    }

    return date;
}

function extractVideoId(value) {
    if (!value) {
        return null;
    }

    const text =
        String(value).trim();

    if (
        /^[A-Za-z0-9_-]{11}$/.test(text)
    ) {
        return text;
    }

    try {
        const url =
            new URL(text);

        if (
            url.hostname ===
            "youtu.be"
        ) {
            return (
                url.pathname
                    .split("/")
                    .filter(Boolean)[0]
                || null
            );
        }

        if (
            url.hostname.includes(
                "youtube.com"
            ) ||
            url.hostname.includes(
                "youtube-nocookie.com"
            )
        ) {
            const id =
                url.searchParams.get("v");

            if (id) {
                return id;
            }

            const parts =
                url.pathname
                    .split("/")
                    .filter(Boolean);

            if (
                parts[0] === "embed" ||
                parts[0] === "shorts"
            ) {
                return parts[1] || null;
            }
        }
    } catch {
        return null;
    }

    return null;
}

async function loadEpisodes() {
    calendarDays.innerHTML =
        '<div class="loading">Loading...</div>';

    try {
        const response =
            await fetch(
                EPISODES_URL +
                "?cache=" +
                Date.now(),
                {
                    cache: "no-store"
                }
            );

        if (!response.ok) {
            throw new Error(
                "HTTP " +
                response.status
            );
        }

        const data =
            await response.json();

        if (!Array.isArray(data)) {
            throw new Error(
                "Invalid episodes.json"
            );
        }

        episodes =
            data
                .map(raw => {
                    if (!raw) {
                        return null;
                    }

                    const number =
                        Number(raw.number);

                    const date =
                        parseEpisodeDate(
                            raw.date
                        );

                    const videoId =
                        extractVideoId(
                            raw.videoId
                        ) ||
                        extractVideoId(
                            raw.url
                        );

                    if (
                        !Number.isInteger(number) ||
                        number < 1 ||
                        !date ||
                        !videoId
                    ) {
                        return null;
                    }

                    return {
                        number,
                        title:
                            raw.title ||
                            `Daily iiSU News: Day ${number}`,
                        date:
                            formatDate(date),
                        videoId
                    };
                })
                .filter(Boolean)
                .sort(
                    (a, b) =>
                        a.number -
                        b.number
                );

        episodeByDate =
            new Map(
                episodes.map(
                    episode => [
                        episode.date,
                        episode
                    ]
                )
            );

        const today =
            getTodayDate();

        const todayEpisode =
            episodeByDate.get(
                today
            );

        if (todayEpisode) {
            selectedEpisode =
                todayEpisode;
        }

        const now =
            new Date();

        currentMonth =
            new Date(
                now.getFullYear(),
                now.getMonth(),
                1
            );

        if (
            isBeforeAllowedMonth(
                currentMonth
            )
        ) {
            currentMonth =
                new Date(
                    FIRST_ALLOWED_MONTH
                        .getFullYear(),
                    FIRST_ALLOWED_MONTH
                        .getMonth(),
                    1
                );
        }

        renderCalendar();

    } catch (error) {
        console.error(
            "Episode scan failed:",
            error
        );

        calendarDays.innerHTML =
            '<div class="loading">Unable to load episodes.</div>';
    }
}

function isBeforeAllowedMonth(date) {
    return (
        date.getFullYear() <
            FIRST_ALLOWED_MONTH.getFullYear() ||
        (
            date.getFullYear() ===
                FIRST_ALLOWED_MONTH.getFullYear() &&
            date.getMonth() <
                FIRST_ALLOWED_MONTH.getMonth()
        )
    );
}

function isFirstAllowedMonth() {
    return (
        currentMonth.getFullYear() ===
            FIRST_ALLOWED_MONTH.getFullYear() &&
        currentMonth.getMonth() ===
            FIRST_ALLOWED_MONTH.getMonth()
    );
}

function renderCalendar() {
    if (
        isBeforeAllowedMonth(
            currentMonth
        )
    ) {
        currentMonth =
            new Date(
                FIRST_ALLOWED_MONTH
                    .getFullYear(),
                FIRST_ALLOWED_MONTH
                    .getMonth(),
                1
            );
    }

    const year =
        currentMonth.getFullYear();

    const month =
        currentMonth.getMonth();

    monthTitle.textContent =
        currentMonth.toLocaleDateString(
            "en-US",
            {
                month: "long",
                year: "numeric"
            }
        );

    prevButton.disabled =
        isFirstAllowedMonth();

    calendarDays.innerHTML =
        "";

    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();

    const daysInMonth =
        new Date(
            year,
            month + 1,
            0
        ).getDate();

    for (
        let i = 0;
        i < firstDay;
        i++
    ) {
        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "day empty";

        calendarDays.appendChild(
            empty
        );
    }

    for (
        let dayNumber = 1;
        dayNumber <= daysInMonth;
        dayNumber++
    ) {
        const date =
            new Date(
                year,
                month,
                dayNumber
            );

        const dateString =
            formatDate(date);

        const episode =
            episodeByDate.get(
                dateString
            );

        const day =
            document.createElement(
                "div"
            );

        day.className =
            "day";

        if (
            dateString ===
            getTodayDate()
        ) {
            day.classList.add(
                "today"
            );
        }

        if (episode) {
            day.classList.add(
                "episode"
            );

            if (
                selectedEpisode &&
                selectedEpisode.number ===
                    episode.number
            ) {
                day.classList.add(
                    "selected"
                );
            }

            day.innerHTML = `
                <span class="day-number">
                    ${dayNumber}
                </span>
                <span class="episode-dot"></span>
            `;

            day.addEventListener(
                "mouseenter",
                () => {
                    if (
                        !hasPlayedHoverSound
                    ) {
                        hasPlayedHoverSound =
                            true;

                        playSound(
                            scrollSound
                        );
                    }
                }
            );

            day.addEventListener(
                "click",
                () => {
                    selectEpisode(
                        episode
                    );
                }
            );
        } else {
            day.innerHTML = `
                <span class="day-number">
                    ${dayNumber}
                </span>
            `;

            if (
                date > new Date()
            ) {
                day.classList.add(
                    "future"
                );
            }
        }

        calendarDays.appendChild(
            day
        );
    }

    const totalCells =
        firstDay +
        daysInMonth;

    for (
        let i = totalCells;
        i < 42;
        i++
    ) {
        const empty =
            document.createElement(
                "div"
            );

        empty.className =
            "day empty";

        calendarDays.appendChild(
            empty
        );
    }

    updateControllerHighlight();
}

function getVisibleEpisodes() {
    return episodes.filter(
        episode => {
            const date =
                parseEpisodeDate(
                    episode.date
                );

            return (
                date &&
                date.getFullYear() ===
                    currentMonth.getFullYear() &&
                date.getMonth() ===
                    currentMonth.getMonth()
            );
        }
    );
}

function updateControllerHighlight() {
    document
        .querySelectorAll(
            ".controller-selected"
        )
        .forEach(
            element => {
                element.classList.remove(
                    "controller-selected"
                );
            }
        );

    if (!selectedEpisode) {
        return;
    }

    const targetDate =
        selectedEpisode.date;

    document
        .querySelectorAll(
            ".day.episode"
        )
        .forEach(day => {
            const number =
                Number(
                    day
                        .querySelector(
                            ".day-number"
                        )
                        ?.textContent
                );

            const date =
                new Date(
                    currentMonth
                        .getFullYear(),
                    currentMonth
                        .getMonth(),
                    number
                );

            if (
                formatDate(date) ===
                targetDate
            ) {
                day.classList.add(
                    "controller-selected"
                );
            }
        });
}

function moveControllerSelection(direction) {
    const visible =
        getVisibleEpisodes();

    if (!visible.length) {
        return;
    }

    let index =
        visible.findIndex(
            episode =>
                selectedEpisode &&
                episode.number ===
                    selectedEpisode.number
        );

    if (index < 0) {
        index =
            direction > 0
                ? 0
                : visible.length - 1;
    } else {
        index += direction;

        if (index < 0) {
            index =
                visible.length - 1;
        }

        if (
            index >=
            visible.length
        ) {
            index = 0;
        }
    }

    selectedEpisode =
        visible[index];

    updateControllerHighlight();

    playSound(
        scrollSound
    );
}

function selectEpisode(episode) {
    selectedEpisode =
        episode;

    playSound(
        linkSound
    );

    videoContainer.innerHTML = `
        <iframe
            src="https://www.youtube.com/embed/${encodeURIComponent(
                episode.videoId
            )}?rel=0&origin=https%3A%2F%2Frealjohniisu.github.io"
            title="${escapeHtml(
                episode.title
            )}"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen>
        </iframe>
    `;

    videoOverlay.classList.add(
        "open"
    );

    document.body.style.overflow =
        "hidden";
}

function closeVideo() {
    videoOverlay.classList.remove(
        "open"
    );

    videoContainer.innerHTML =
        "";

    document.body.style.overflow =
        "";
}

function changeMonth(amount) {
    const nextMonth =
        new Date(
            currentMonth.getFullYear(),
            currentMonth.getMonth() +
                amount,
            1
        );

    if (
        isBeforeAllowedMonth(
            nextMonth
        )
    ) {
        currentMonth =
            new Date(
                FIRST_ALLOWED_MONTH
                    .getFullYear(),
                FIRST_ALLOWED_MONTH
                    .getMonth(),
                1
            );

        return;
    }

    currentMonth =
        nextMonth;

    playSound(
        moveSound
    );

    renderCalendar();
}

function escapeHtml(value) {
    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}

function playSound(audio) {
    audio.currentTime = 0;

    audio.play().catch(
        () => {}
    );
}

prevButton.addEventListener(
    "click",
    () => {
        if (
            !prevButton.disabled
        ) {
            changeMonth(-1);
        }
    }
);

nextButton.addEventListener(
    "click",
    () => {
        changeMonth(1);
    }
);

closeButton.addEventListener(
    "click",
    closeVideo
);

videoOverlay.addEventListener(
    "click",
    event => {
        if (
            event.target ===
            videoOverlay
        ) {
            closeVideo();
        }
    }
);

videoModal.addEventListener(
    "click",
    event => {
        event.stopPropagation();
    }
);

document.addEventListener(
    "keydown",
    event => {
        if (
            event.key ===
            "Escape"
        ) {
            closeVideo();
            return;
        }

        if (
            event.key ===
            "ArrowLeft"
        ) {
            changeMonth(-1);
        }

        if (
            event.key ===
            "ArrowRight"
        ) {
            changeMonth(1);
        }

        if (
            event.key ===
            "ArrowUp"
        ) {
            moveControllerSelection(-1);
        }

        if (
            event.key ===
            "ArrowDown"
        ) {
            moveControllerSelection(1);
        }

        if (
            event.key === "Enter" ||
            event.key === " "
        ) {
            if (
                selectedEpisode &&
                !videoOverlay.classList.contains(
                    "open"
                )
            ) {
                selectEpisode(
                    selectedEpisode
                );
            }
        }
    }
);

const controllerState =
    new Map();

const AXIS_DEADZONE =
    0.45;

const AXIS_RELEASE =
    0.20;

const INPUT_REPEAT_DELAY =
    180;

function getControllerState(index) {
    if (
        !controllerState.has(index)
    ) {
        controllerState.set(
            index,
            {
                left: false,
                right: false,
                up: false,
                down: false,
                a: false,
                b: false,
                lb: false,
                rb: false,
                lastMove: 0
            }
        );
    }

    return controllerState.get(
        index
    );
}

function isButtonPressed(
    gamepad,
    index
) {
    return Boolean(
        gamepad.buttons[index] &&
        gamepad.buttons[index].pressed
    );
}

function axisActive(
    value,
    positive
) {
    if (
        typeof value !==
        "number"
    ) {
        return false;
    }

    if (positive) {
        return value >= AXIS_DEADZONE;
    }

    return value <= -AXIS_DEADZONE;
}

function axisReleased(
    value
) {
    return (
        typeof value !== "number" ||
        Math.abs(value) <=
            AXIS_RELEASE
    );
}

function getDirection(
    gamepad,
    state
) {
    let left =
        isButtonPressed(
            gamepad,
            14
        );

    let right =
        isButtonPressed(
            gamepad,
            15
        );

    let up =
        isButtonPressed(
            gamepad,
            12
        );

    let down =
        isButtonPressed(
            gamepad,
            13
        );

    const axes =
        gamepad.axes || [];

    const stickX =
        Number(axes[0] || 0);

    const stickY =
        Number(axes[1] || 0);

    const dpadX =
        Number(
            axes[6] ||
            0
        );

    const dpadY =
        Number(
            axes[7] ||
            0
        );

    if (
        axisActive(
            stickX,
            false
        ) ||
        axisActive(
            dpadX,
            false
        )
    ) {
        left = true;
    }

    if (
        axisActive(
            stickX,
            true
        ) ||
        axisActive(
            dpadX,
            true
        )
    ) {
        right = true;
    }

    if (
        axisActive(
            stickY,
            false
        ) ||
        axisActive(
            dpadY,
            false
        )
    ) {
        up = true;
    }

    if (
        axisActive(
            stickY,
            true
        ) ||
        axisActive(
            dpadY,
            true
        )
    ) {
        down = true;
    }

    const now =
        performance.now();

    if (
        now - state.lastMove <
        INPUT_REPEAT_DELAY
    ) {
        left =
            left &&
            !state.left;

        right =
            right &&
            !state.right;

        up =
            up &&
            !state.up;

        down =
            down &&
            !state.down;
    }

    if (
        left ||
        right ||
        up ||
        down
    ) {
        state.lastMove =
            now;
    }

    return {
        left,
        right,
        up,
        down
    };
}

function pollControllers() {
    if (
        !navigator.getGamepads
    ) {
        requestAnimationFrame(
            pollControllers
        );

        return;
    }

    const gamepads =
        navigator.getGamepads();

    for (
        const gamepad of gamepads
    ) {
        if (!gamepad) {
            continue;
        }

        const state =
            getControllerState(
                gamepad.index
            );

        const direction =
            getDirection(
                gamepad,
                state
            );

        const a =
            isButtonPressed(
                gamepad,
                0
            );

        const b =
            isButtonPressed(
                gamepad,
                1
            );

        const lb =
            isButtonPressed(
                gamepad,
                4
            );

        const rb =
            isButtonPressed(
                gamepad,
                5
            );

        const aPressed =
            a && !state.a;

        const bPressed =
            b && !state.b;

        const lbPressed =
            lb && !state.lb;

        const rbPressed =
            rb && !state.rb;

        if (
            direction.left
        ) {
            changeMonth(-1);
        }

        if (
            direction.right
        ) {
            changeMonth(1);
        }

        if (
            direction.up
        ) {
            moveControllerSelection(
                -1
            );
        }

        if (
            direction.down
        ) {
            moveControllerSelection(
                1
            );
        }

        if (
            lbPressed
        ) {
            changeMonth(-1);
        }

        if (
            rbPressed
        ) {
            changeMonth(1);
        }

        if (
            aPressed &&
            selectedEpisode &&
            !videoOverlay.classList.contains(
                "open"
            )
        ) {
            selectEpisode(
                selectedEpisode
            );
        }

        if (
            bPressed &&
            videoOverlay.classList.contains(
                "open"
            )
        ) {
            closeVideo();
        }

        state.left =
            direction.left;

        state.right =
            direction.right;

        state.up =
            direction.up;

        state.down =
            direction.down;

        state.a =
            a;

        state.b =
            b;

        state.lb =
            lb;

        state.rb =
            rb;
    }

    requestAnimationFrame(
        pollControllers
    );
}

window.addEventListener(
    "gamepadconnected",
    event => {
        console.log(
            "Controller connected:",
            event.gamepad.id
        );

        controllerState.delete(
            event.gamepad.index
        );
    }
);

window.addEventListener(
    "gamepaddisconnected",
    event => {
        controllerState.delete(
            event.gamepad.index
        );
    }
);

requestAnimationFrame(
    pollControllers
);

loadEpisodes();
</script>
